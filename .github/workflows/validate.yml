name: validate

on:
  push:
    paths: ["registry.json", "scripts/**", "package.json", ".github/workflows/**"]
  pull_request:
    paths: ["registry.json", "scripts/**", "package.json", ".github/workflows/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run validate
