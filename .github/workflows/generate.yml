name: generate index

# 生成 index.json，有变化时由 bot 直接提交到 main，无需人工操作
on:
  push:
    branches: [main]
    paths: ["plugins.txt", "scripts/**", ".github/**"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-index
  cancel-in-progress: false

env:
  DSH_REF: dsh-v0.2.1-rc.3

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-generator
        with:
          dsh-ref: ${{ env.DSH_REF }}

      - uses: actions/cache@v4
        with:
          path: .plugin-market-cache
          key: plugin-market-cache-${{ env.DSH_REF }}-${{ github.run_id }}
          restore-keys: plugin-market-cache-${{ env.DSH_REF }}-

      # 有来源读取失败（退出码 1）时生成器保留它上次的结果，照样提交，最后再让任务失败以便通知
      - name: Generate index.json
        id: generate
        run: |
          status=0
          scripts/generate.sh || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" -le 1 ]

      - name: Commit changes
        run: |
          git add -A index.json $(test -d icons && echo icons)
          if git diff --cached --quiet; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate index.json"
          git push

      - name: Fail on unreadable sources
        if: steps.generate.outputs.status == '1'
        run: |
          echo "::error::有来源读取失败，见 Generate index.json 步骤"
          exit 1
