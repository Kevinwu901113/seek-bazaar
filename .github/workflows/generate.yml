name: generate index

on:
  push:
    branches: [main]
    paths: ["plugins.txt", ".github/workflows/generate.yml"]
  # PR 只试跑生成器检查来源能否读取，不提交
  pull_request:
    paths: ["plugins.txt", ".github/workflows/generate.yml"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-index-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Fetch DSH plugin market generator
        run: |
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness "$RUNNER_TEMP/dsh"
          cd "$RUNNER_TEMP/dsh"
          pnpm install --filter "@deepseek-ai/dsh-plugin-market-generator..." --ignore-scripts

      - uses: actions/cache@v4
        with:
          path: .plugin-market-cache
          key: plugin-market-cache-${{ github.run_id }}
          restore-keys: plugin-market-cache-

      - name: Generate index.json
        run: |
          cd "$RUNNER_TEMP/dsh"
          pnpm --filter @deepseek-ai/dsh-plugin-market-generator start \
            --input "$GITHUB_WORKSPACE/plugins.txt" \
            --output "$GITHUB_WORKSPACE/index.json" \
            --cache "$GITHUB_WORKSPACE/.plugin-market-cache" \
            --title "Seek Bazaar" \
            --description "DeepSeek Harness 插件市场"

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git add index.json icons 2>/dev/null || git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate index.json"
          git push
